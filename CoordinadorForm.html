<!-- MÓDULO SPA: FORMULARIO DE GESTIÓN DE PROPONENTE / COORDINADOR -->
<div class="max-w-xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-md border border-slate-200 relative">
  
  <!-- SPINNER DE CARGA -->
  <div id="loadingOverlayCoord" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex items-center justify-center rounded-xl hidden">
    <div class="flex flex-col items-center gap-3">
      <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-600"></i>
      <span class="text-sm font-semibold text-slate-700">Procesando solicitud...</span>
    </div>
  </div>

  <!-- ENCABEZADO Y BOTÓN SALIR -->
  <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-6">
    <div>
      <h2 id="cooFormTitle" class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <i class="fas fa-user-tie text-indigo-600"></i> Gestionar Proponente
      </h2>
      <p class="text-xs text-slate-500 mt-0.5">Añade o actualiza la información básica del Proponente/Coordinador.</p>
    </div>
    <button type="button" onclick="loadView('ProgramaPosgradoForm', {}, this)" 
      class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors border border-slate-300">
      <i class="fas fa-arrow-left"></i> Volver
    </button>
  </div>

  <!-- FILA DE ID (SOLO VISIBLE EN EDICIÓN) -->
  <div id="cooIdDisplayRow" class="hidden mb-4 p-3 bg-indigo-50 border border-indigo-200 rounded-lg flex items-center justify-between">
    <span class="text-xs font-semibold text-indigo-900">ID Registrado:</span>
    <span id="cooIdDisplayLabel" class="text-xs font-mono font-bold text-indigo-700"></span>
  </div>

  <!-- FORMULARIO -->
  <form id="coordinadorForm" class="space-y-4">
    <input type="hidden" id="coordinadorID" name="coordinadorID">

    <div>
      <label for="cooNombreCompleto" class="block text-xs font-semibold text-slate-700 mb-1">
        Nombre Completo <span class="text-red-500">*</span>
      </label>
      <input type="text" id="cooNombreCompleto" name="nombreCompleto" required 
        class="w-full rounded-lg border-slate-300 p-2.5 border text-sm focus:ring-2 focus:ring-indigo-500">
    </div>

    <div>
      <label for="cooCorreoInstitucional" class="block text-xs font-semibold text-slate-700 mb-1">
        Correo Institucional <span class="text-red-500">*</span>
      </label>
      <input type="email" id="cooCorreoInstitucional" name="correoInstitucional" required 
        class="w-full rounded-lg border-slate-300 p-2.5 border text-sm focus:ring-2 focus:ring-indigo-500">
    </div>

    <div>
      <label for="cooGenero" class="block text-xs font-semibold text-slate-700 mb-1">
        Género <span class="text-red-500">*</span>
      </label>
      <select id="cooGenero" name="genero" required class="w-full rounded-lg border-slate-300 p-2.5 border text-sm bg-white focus:ring-2 focus:ring-indigo-500">
        <option value="">Cargando...</option>
      </select>
    </div>

    <div class="flex justify-end pt-4 border-t border-slate-200">
      <button type="submit" id="cooSaveBtn" 
        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold flex items-center gap-2 shadow-sm transition-colors">
        <i class="fas fa-save"></i> Guardar Proponente/Coordinador
      </button>
    </div>
  </form>
</div>

<!-- MODAL DE NOTIFICACIÓN CORREGIDO -->
<div id="coordNotificationModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-sm w-full p-6 text-center space-y-4">
    <div id="coordNotifyIcon" class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl">
      <i class="fas fa-info-circle"></i>
    </div>
    <p id="coordNotificationMessage" class="text-sm font-semibold text-slate-800"></p>
    <div class="flex justify-center pt-2">
      <button id="coordNotifyOkBtn" type="button" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition-colors">
        Aceptar
      </button>
    </div>
  </div>
</div>

<!-- LÓGICA JAVASCRIPT SIN ERRORES DE SINTAXIS -->
<script>
(function initCoordinadorForm() {
  const coordForm = document.getElementById('coordinadorForm');
  const formTitle = document.getElementById('cooFormTitle');
  const coordinadorIDInput = document.getElementById('coordinadorID');
  const idDisplayRow = document.getElementById('cooIdDisplayRow');
  const coordinadorIDLabel = document.getElementById('cooIdDisplayLabel');
  const saveBtn = document.getElementById('cooSaveBtn');
  const loadingOverlay = document.getElementById('loadingOverlayCoord');

  // RESOLUCIÓN DE ESTADO DE LA SPA
  const state = window.SysgupState || {};
  const isEditMode = (state.currentMode === 'edit' || state.mode === 'edit') && !!state.id;
  const targetID = state.id || '';

  function toggleLoading(show) {
    if (loadingOverlay) loadingOverlay.classList.toggle('hidden', !show);
  }

  function showNotify(msg, isSuccess = false) {
    const modal = document.getElementById('coordNotificationModal');
    const icon = document.getElementById('coordNotifyIcon');
    
    if (icon) {
      icon.className = isSuccess 
        ? 'w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl'
        : 'w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl';
      icon.innerHTML = isSuccess ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-info-circle"></i>';
    }

    document.getElementById('coordNotificationMessage').textContent = msg;
    if (modal) modal.classList.remove('hidden');
  }

  const okBtn = document.getElementById('coordNotifyOkBtn');
  if (okBtn) {
    okBtn.onclick = () => {
      const modal = document.getElementById('coordNotificationModal');
      if (modal) modal.classList.add('hidden');
    };
  }

  function loadCoordForEdit(id) {
    if (formTitle) formTitle.textContent = 'Editar Proponente';
    if (idDisplayRow) idDisplayRow.classList.remove('hidden');
    if (saveBtn) saveBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Actualizar Proponente';

    toggleLoading(true);

    google.script.run
      .withSuccessHandler(data => {
        toggleLoading(false);
        const c = (typeof data === 'string') ? JSON.parse(data) : data;

        if (c) {
          if (coordinadorIDInput) coordinadorIDInput.value = c.coordinadorID || id;
          if (coordinadorIDLabel) coordinadorIDLabel.textContent = c.coordinadorID || id;
          if (document.getElementById('cooNombreCompleto')) document.getElementById('cooNombreCompleto').value = c.nombreCompleto || '';
          if (document.getElementById('cooCorreoInstitucional')) document.getElementById('cooCorreoInstitucional').value = c.correoInstitucional || '';
          if (document.getElementById('cooGenero')) document.getElementById('cooGenero').value = c.genero || '';
        } else {
          showNotify(`Registro de proponente con ID ${id} no encontrado.`);
        }
      })
      .withFailureHandler(err => {
        toggleLoading(false);
        showNotify("Error al cargar proponente: " + err.message);
      })
      .getCoordinadorById(id);
  }

  // CARGA DE DROPDOWN Y DETECCIÓN MODO EDICIÓN
  toggleLoading(true);
  google.script.run
    .withSuccessHandler(generos => {
      toggleLoading(false);
      const list = (typeof generos === 'string') ? JSON.parse(generos) : generos;
      const select = document.getElementById('cooGenero');
      if (select) {
        let html = '<option value="">-- Seleccione Género --</option>';
        if (Array.isArray(list)) {
          list.forEach(g => { html += `<option value="${g}">${g}</option>`; });
        }
        select.innerHTML = html;
      }

      if (isEditMode && targetID) {
        loadCoordForEdit(targetID);
      }
    })
    .withFailureHandler(err => {
      toggleLoading(false);
      console.error("Error al cargar géneros:", err);
      if (isEditMode && targetID) {
        loadCoordForEdit(targetID);
      }
    })
    .getDropdownData('Generos');

  // SUBMIT DEL FORMULARIO DE COORDINADOR
  if (coordForm) {
    coordForm.onsubmit = (e) => {
      e.preventDefault();
      toggleLoading(true);
      const data = Object.fromEntries(new FormData(coordForm));
      const isEdit = !!(data.coordinadorID && data.coordinadorID.trim() !== '');
      const action = isEdit ? 'updateCoordinador' : 'createCoordinador';

      google.script.run
        .withSuccessHandler(res => {
          toggleLoading(false);
          if (res && res.success) {
            document.dispatchEvent(new CustomEvent('sysgup:coordinadorSaved', { detail: res }));
            showNotify(isEdit ? "Proponente actualizado con éxito." : "Proponente creado con éxito.", true);
            setTimeout(() => {
              if (typeof loadView === 'function') {
                loadView('ProgramaPosgradoForm', {}, null);
              }
            }, 1200);
          } else {
            showNotify("Atención: " + (res ? res.message : "No se pudo procesar la solicitud."));
          }
        })
        .withFailureHandler(err => {
          toggleLoading(false);
          showNotify("Error en el servidor al guardar: " + err.message);
        })[action](data);
    };
  }
})();
</script>
