<style>
.form-container-obs { background-color: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100%; max-width: 1000px; margin: 1rem auto; position: relative; }
.btn-obs { padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; font-size: 0.875rem; }
.btn-obs:hover:not(:disabled) { transform: translateY(-1px); }
.btn-obs-primary { background-color: #4f46e5; color: #ffffff; }
.btn-obs-secondary { background-color: #6b7280; color: #ffffff; }
.btn-obs-edit { background-color: #f59e0b; color: #ffffff; padding: 0.25rem 0.6rem; font-size: 0.7rem; }
.loading-overlay-obs { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.85); display: flex; justify-content: center; align-items: center; z-index: 100; border-radius: 12px; }
.spinner-obs { border: 4px solid #e5e7eb; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spinObs 1s linear infinite; }
@keyframes spinObs { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.search-results-obs { border: 1px solid #d1d5db; border-radius: 8px; max-height: 180px; overflow-y: auto; background-color: #fff; position: absolute; width: 100%; z-index: 20; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.search-results-obs div { padding: 0.75rem; border-bottom: 1px solid #e5e7eb; cursor: pointer; font-size: 0.875rem; }
.search-results-obs div:hover { background-color: #eef2ff; }
.selected-program-card { background-color: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; padding: 1.5rem; border-radius: 8px; }
.semaforo-badge { font-weight: 800; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.7rem; text-transform: uppercase; }
.sem-A_tiempo { background-color: #d1fae5; color: #065f46; }
.sem-Proximo_a_vencer { background-color: #fef3c7; color: #92400e; }
.sem-Vencido { background-color: #fee2e2; color: #991b1b; }
.sem-Corregido_Atrasado { background-color: #fecaca; color: #991b1b; }
.sem-Plazo_lejano { background-color: #e5e7eb; color: #4b5563; }

/* MODAL SPA FIX CSS */
.modal-overlay-spa { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; }
.modal-overlay-spa.show { display: flex !important; }
.modal-content-spa { background: #ffffff; padding: 2rem; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); max-width: 420px; width: 90%; text-align: center; }
</style>

<div class="form-container-obs" id="obsMainContainer">
  <div id="loadingOverlayObs" class="loading-overlay-obs" style="display: none;">
    <div class="spinner-obs"></div>
  </div>

  <header class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 pb-5 mb-8 gap-4">
    <div>
      <h2 id="obsFormTitle" class="text-3xl font-bold text-gray-800">Seguimiento de Programas</h2>
      <p class="mt-1 text-gray-500 text-sm">Gestión del proceso regulatorio y control de observaciones por programa.</p>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" onclick="if (typeof goHome === 'function') { goHome(); }" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors border border-slate-300">
        <i class="fas fa-sign-out-alt"></i> Salir al Inicio
      </button>
    </div>
  </header>


  <!-- 1. BÚSQUEDA -->
  <div id="divBusquedaObs" class="mb-6 pb-6 border-b">
    <label class="block text-sm font-medium text-gray-700 mb-1">Buscar propuesta de programa de posgrado</label>
    <div class="relative">
      <input type="text" id="searchProgramaObs" placeholder="Nombre del Programa o Código SNIESE..." class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3 border">
      <div id="obsSearchResults" class="search-results-obs hidden"></div>
    </div>
  </div>

  <!-- 2. DETALLES Y ACCIONES -->
  <div id="obsDetailsSection" class="hidden space-y-8">
    <div class="flex justify-start">
      <button onclick="window.volverABusquedaObs()" class="btn-obs btn-obs-secondary">← Volver a Búsqueda</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div id="selectedProgramInfo" class="lg:col-span-2 selected-program-card"></div>

      <div class="bg-gray-50 p-6 rounded-lg border">
        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Transición de Fase</label>
        <select id="estadoPropuestaObsSelect" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 p-2 border mb-3 bg-white text-sm"></select>
        <div class="flex flex-col gap-2">
          <button id="updateStateObsBtn" class="btn-obs btn-obs-secondary w-full">Actualizar Fase</button>
          <button id="jumpToModificaBtn" class="btn-obs btn-obs-primary w-full">Modificar Datos Técnicos</button>
        </div>
      </div>
    </div>

    <!-- 3. HISTORIAL DE OBSERVACIONES -->
    <div>
      <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
        <i class="fas fa-history mr-2 text-indigo-500"></i> Historial de Observaciones
      </h3>
      <div id="obsTableContainer" class="overflow-x-auto border rounded-lg bg-white"></div>
    </div>

    <!-- 4. FORMULARIO DE REGISTRO / EDICIÓN -->
    <div class="bg-slate-50 p-6 rounded-xl border-2 border-dashed border-slate-200">
      <h3 id="formObservacionTitle" class="text-lg font-bold text-slate-700 mb-4">Registrar Nueva Observación</h3>
      <form id="addObservacionForm" class="space-y-4">
        <input type="hidden" id="observacionID_obs" name="observacionID">
        <div>
          <label class="block text-sm font-medium text-gray-700">Descripción de la Observación</label>
          <textarea id="obsDescripcion" name="descripcion" required class="mt-1 block w-full rounded-md border-gray-300 p-3 border" rows="3"></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Fecha Observación (DD/MM/AAAA)</label>
            <input type="text" id="fechaObservacionObs" name="fechaObservacion" required class="mt-1 block w-full rounded-md border-gray-300 p-2 border bg-gray-100" readonly>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Fecha Límite (CES)</label>
            <input type="date" id="fechaCorreccionEsperada" name="fechaCorreccionEsperada" required class="mt-1 block w-full rounded-md border-gray-300 p-2 border">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Fecha de Solución</label>
            <input type="date" id="fechaCorreccionRecibida" name="fechaCorreccionRecibida" class="mt-1 block w-full rounded-md border-gray-300 p-2 border">
          </div>
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" onclick="window.resetObsForm()" class="btn-obs btn-obs-secondary">Limpiar</button>
          <button type="submit" id="saveObsBtn" class="btn-obs btn-obs-primary">Guardar Observación</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL DE NOTIFICACIÓN SPA CORREGIDO -->
<div id="obsNotificationModal" class="modal-overlay-spa">
  <div class="modal-content-spa">
    <p id="obsNotificationMessage" class="text-base font-semibold mb-4"></p>
    <div class="flex justify-center">
      <button id="obsNotifyOkBtn" class="btn-obs btn-obs-primary">Aceptar</button>
    </div>
  </div>
</div>

<script>
(function initObservacionesForm() {
  const loading = document.getElementById('loadingOverlayObs');
  const searchInput = document.getElementById('searchProgramaObs');
  const resultsDiv = document.getElementById('obsSearchResults');
  const detailsSection = document.getElementById('obsDetailsSection');
  const addObsForm = document.getElementById('addObservacionForm');
  const updateStateBtn = document.getElementById('updateStateObsBtn');

  let selectedPrograma = null;
  let obsCache = [];

  function safeParse(data) {
    if (!data) return [];
    if (typeof data === 'string') {
      try { return JSON.parse(data); } catch(e) { return []; }
    }
    return Array.isArray(data) ? data : [];
  }

  function toggleLoading(show) {
    if (loading) loading.style.display = show ? 'flex' : 'none';
  }

  function handleServerError(err) {
    toggleLoading(false);
    showNotify('Error de comunicación con el servidor: ' + (err.message || err), false);
  }

  function showNotify(msg, isSuccess = false) {
    const el = document.getElementById('obsNotificationMessage');
    if (el) {
      el.textContent = msg;
      el.className = isSuccess ? 'text-base font-semibold text-green-600 mb-4' : 'text-base font-semibold text-red-600 mb-4';
    }
    const modal = document.getElementById('obsNotificationModal');
    if (modal) modal.classList.add('show');
  }

  const okBtn = document.getElementById('obsNotifyOkBtn');
  if (okBtn) {
    okBtn.onclick = function() {
      const modal = document.getElementById('obsNotificationModal');
      if (modal) modal.classList.remove('show');
    };
  }

  function getTodayDDMMYYYY() {
    const d = new Date();
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    return `${day}/${month}/${d.getFullYear()}`;
  }

  window.volverABusquedaObs = function() {
    if (detailsSection) detailsSection.classList.add('hidden');
    const divBusqueda = document.getElementById('divBusquedaObs');
    if (divBusqueda) divBusqueda.classList.remove('hidden');
    if (searchInput) searchInput.value = '';
    selectedPrograma = null;
  };

  window.resetObsForm = function() {
    if (addObsForm) addObsForm.reset();
    const obsIdInput = document.getElementById('observacionID_obs');
    if (obsIdInput) obsIdInput.value = '';
    const formTitle = document.getElementById('formObservacionTitle');
    if (formTitle) formTitle.textContent = 'Registrar Nueva Observación';
    const fechaObs = document.getElementById('fechaObservacionObs');
    if (fechaObs) fechaObs.value = getTodayDDMMYYYY();
  };

  window.editObsIdx = function(idx) {
    const o = obsCache[idx];
    if (!o) return;
    document.getElementById('observacionID_obs').value = o.observacionID;
    document.getElementById('obsDescripcion').value = o.descripcion;
    document.getElementById('fechaCorreccionEsperada').value = o.fechaCorreccionEsperada || '';
    document.getElementById('fechaCorreccionRecibida').value = o.fechaCorreccionRecibida || '';
    document.getElementById('formObservacionTitle').textContent = `Editando Observación: ${o.observacionID}`;
    if (addObsForm) addObsForm.scrollIntoView({ behavior: 'smooth' });
  };

  // --- BÚSQUEDA ---
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim();
      if (query.length < 2) { resultsDiv.classList.add('hidden'); return; }
      resultsDiv.innerHTML = '<div class="p-3 text-gray-400 italic">Buscando programas...</div>';
      resultsDiv.classList.remove('hidden');

      google.script.run
        .withSuccessHandler(data => {
          const programs = safeParse(data);
          resultsDiv.innerHTML = '';
          if (programs.length === 0) {
            resultsDiv.innerHTML = '<div class="p-3 text-gray-400">No hay coincidencias.</div>';
            return;
          }
          programs.forEach(p => {
            const div = document.createElement('div');
            div.textContent = `${p.nombrePrograma} [${p.estadoPropuesta}]`;
            div.onclick = () => selectProgramObs(p);
            resultsDiv.appendChild(div);
          });
        })
        .withFailureHandler(handleServerError)
        .searchProgramas(query);
    });
  }

  function selectProgramObs(program) {
    selectedPrograma = program;
    if (resultsDiv) resultsDiv.classList.add('hidden');
    document.getElementById('divBusquedaObs').classList.add('hidden');
    if (detailsSection) detailsSection.classList.remove('hidden');

    renderProgramHeader();
    loadTransitions(program.estadoPropuesta);
    loadObservations(program.programaID);
    window.resetObsForm();
  }

  function renderProgramHeader() {
    const container = document.getElementById('selectedProgramInfo');
    if (!container || !selectedPrograma) return;

    container.innerHTML = `
      <h3 class="text-xl font-bold">${selectedPrograma.nombrePrograma}</h3>
      <p class="text-sm italic mb-3">${selectedPrograma.mencion || 'Sin mención'}</p>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div><strong>Facultad:</strong> ${selectedPrograma.facultad}</div>
        <div><strong>Estado Actual:</strong> <span class="font-bold text-indigo-700" id="currentPhaseLabel">${selectedPrograma.estadoPropuesta}</span></div>
        <div id="coordDisplayObs"><strong>Responsable:</strong> Cargando...</div>
      </div>`;

    if (selectedPrograma.coordinadorID) {
      google.script.run
        .withSuccessHandler(c => {
          const coordEl = document.getElementById('coordDisplayObs');
          if (coordEl && c) {
            coordEl.innerHTML = `<strong>Responsable:</strong> ${c.nombreCompleto} (${c.correoInstitucional})`;
          }
        })
        .withFailureHandler(handleServerError)
        .getCoordinadorById(selectedPrograma.coordinadorID);
    }
  }

  function loadTransitions(fase) {
    const sel = document.getElementById('estadoPropuestaObsSelect');
    if (!sel) return;
    sel.innerHTML = '<option>Cargando transiciones...</option>';

    google.script.run
      .withSuccessHandler(data => {
        const list = safeParse(data);
        sel.innerHTML = '';
        if (list.length === 0) {
          sel.innerHTML = '<option>Sin transiciones configuradas</option>';
          return;
        }
        list.forEach(v => sel.add(new Option(v, v)));
      })
      .withFailureHandler(handleServerError)
      .getTransicionesPosibles(fase);
  }

  // --- BOTÓN ACTUALIZAR FASE (SOLUCIÓN ERROR 1) ---
  if (updateStateBtn) {
    updateStateBtn.onclick = function() {
      const sel = document.getElementById('estadoPropuestaObsSelect');
      if (!selectedPrograma || !sel || !sel.value) return;

      const nuevaFase = sel.value;
      toggleLoading(true);

      google.script.run
        .withSuccessHandler(res => {
          toggleLoading(false);
          if (res && res.success) {
            showNotify(`Fase actualizada a "${nuevaFase}" con éxito.`, true);
            selectedPrograma.estadoPropuesta = nuevaFase;
            renderProgramHeader();
            loadTransitions(nuevaFase);
          } else {
            showNotify("Error al actualizar la fase: " + (res ? res.message : "Error del servidor"), false);
          }
        })
        .withFailureHandler(handleServerError)
        .updateProgramaPosgrado({ programaID: selectedPrograma.programaID, estadoPropuesta: nuevaFase });
    };
  }

  function loadObservations(id) {
    toggleLoading(true);
    google.script.run
      .withSuccessHandler(data => {
        obsCache = safeParse(data);
        renderObsTable();
        toggleLoading(false);
      })
      .withFailureHandler(handleServerError)
      .getObservacionesByProgramaId(id);
  }

  function renderObsTable() {
    const container = document.getElementById('obsTableContainer');
    if (!container) return;

    if (obsCache.length === 0) {
      container.innerHTML = '<p class="p-8 text-center text-gray-400">Sin observaciones registradas para este programa.</p>';
      return;
    }

    let html = '<table class="w-full text-sm"><thead><tr class="bg-gray-50 font-bold text-gray-500 border-b text-left">' +
      '<th class="p-3">ID</th><th class="p-3">Descripción</th><th class="p-3">Límite</th><th class="p-3 text-center">Estado</th><th class="p-3 text-right">Acción</th></tr></thead><tbody>';

    obsCache.forEach((o, i) => {
      const semaforoTexto = (o.estadoSemaforo || 'Plazo_lejano').replace(/_/g, ' ');
      html += `<tr class="border-b hover:bg-gray-50">
        <td class="p-3 font-mono text-xs text-gray-500">${o.observacionID || ''}</td>
        <td class="p-3 text-gray-700">${o.descripcion || ''}</td>
        <td class="p-3 text-gray-600">${o.fechaCorreccionEsperada || ''}</td>
        <td class="p-3 text-center"><span class="semaforo-badge sem-${o.estadoSemaforo || 'Plazo_lejano'}">${semaforoTexto}</span></td>
        <td class="p-3 text-right"><button type="button" onclick="window.editObsIdx(${i})" class="btn-obs-edit rounded">Editar</button></td>
      </tr>`;
    });
    container.innerHTML = html + '</tbody></table>';
  }

  // --- NAVEGACIÓN A MODIFICA FORM ---
  const jumpBtn = document.getElementById('jumpToModificaBtn');
  if (jumpBtn) {
    jumpBtn.onclick = () => {
      if (selectedPrograma && typeof loadView === 'function') {
        window.SysgupState = {
          currentMode: 'edit',
          id: selectedPrograma.programaID,
          currentPage: 'ModificaForm'
        };
        loadView('ModificaForm', { id: selectedPrograma.programaID });
      } else {
        showNotify("Seleccione un programa antes de modificar sus datos.", false);
      }
    };
  }

  // --- PROCESAMIENTO DE FORMULARIO ---
  if (addObsForm) {
    addObsForm.onsubmit = (e) => {
      e.preventDefault();
      if (!selectedPrograma) return;

      toggleLoading(true);
      const data = Object.fromEntries(new FormData(addObsForm));
      data.programaID = selectedPrograma.programaID;

      const action = (data.observacionID && data.observacionID.trim() !== '')
        ? 'updateObservacion'
        : 'createObservacion';

      google.script.run
        .withSuccessHandler(res => {
          toggleLoading(false);
          if (res && res.success) {
            showNotify('Observación guardada correctamente.', true);
            window.resetObsForm();
            loadObservations(selectedPrograma.programaID);
          } else {
            showNotify('Atención: ' + (res ? res.message : 'Error al guardar'), false);
          }
        })
        .withFailureHandler(handleServerError)
        [action](data);
    };
  }

  window.resetObsForm();
})();
</script>
